packaging_format = 2

id = "finance"
name = "Finance"
description.en = "Self-hosted personal finance: statement import, reconciliation and analytics"
version = "0.3.30~ynh1"
maintainers = ["heldermcosta"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/heldermcosta/yunohost-finance"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"   # login is handled by SSOwat in front of the app (permission auth_header)
disk = "300M"
ram.build = "300M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/finance"

    [install.init_main_permission]
    # Household members: every logged-in YunoHost user. Narrow this if needed.
    type = "group"
    default = "all_users"

[resources]
    [resources.sources.main]
    # Source archive of commit cfabf36a52f15fdde5810f5d8f2b9feb859eee7a on main (public repository).
    url = "https://github.com/heldermcosta/yunohost-finance/archive/058ff8c749fad86a393382f416c55f0928ba3c5e.tar.gz"
    sha256 = "c146bff9742222bead7c4d058cfd9912c308e432f85389f77f3917aec2cf4d48"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = true

    [resources.ports]
    main.default = 8800

    [resources.database]
    type = "postgresql"

    [resources.apt]
    packages = "poppler-utils, tesseract-ocr, tesseract-ocr-por, python3-venv, python3-dev"
