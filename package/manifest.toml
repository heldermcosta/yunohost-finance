packaging_format = 2

id = "finance"
name = "Finance"
description.en = "Self-hosted personal finance: statement import, reconciliation and analytics"
version = "0.3.47~ynh1"
maintainers = ["heldermcosta"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/heldermcosta/yunohost-finance"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"   # login is handled by SSOwat in front of the app (permission auth_header)
disk = "300M"
ram.build = "300M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/finance"

    [install.init_main_permission]
    # Household members: every logged-in YunoHost user. Narrow this if needed.
    type = "group"
    default = "all_users"

[resources]
    [resources.sources.main]
    # Source archive of commit e7ee8c9bcfd4c1328b6ecaeb0ed356b381b68d28 on main (public repository).
    url = "https://github.com/heldermcosta/yunohost-finance/archive/61990ba845a69fbd7964a3131ce06b4ff7e757fb.tar.gz"
    sha256 = "e1d7155e2afeb25c5516b30b3ef20fd6c2f5495ebf4993b5bc5092e4f1b5b495"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = true

    [resources.ports]
    main.default = 8800

    [resources.database]
    type = "postgresql"

    [resources.apt]
    packages = "poppler-utils, tesseract-ocr, tesseract-ocr-por, python3-venv, python3-dev"
