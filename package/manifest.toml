packaging_format = 2

id = "finance"
name = "Finance"
description.en = "Self-hosted personal finance: statement import, reconciliation and analytics"
version = "0.3.0~ynh1"
maintainers = ["heldermcosta"]

[upstream]
# TODO: choose the licence before publishing (SPDX identifier).
license = "LicenseRef-proprietary"
code = "https://github.com/heldermcosta/yunohost-finance"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"   # login is handled by SSOwat in front of the app (permission auth_header)
disk = "300M"
ram.build = "300M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/finance"

    [install.init_main_permission]
    # Household members: every logged-in YunoHost user. Narrow this if needed.
    type = "group"
    default = "all_users"

[resources]
    [resources.sources.main]
    # Source archive of commit 99a5b8849b21627202aa39be3ecc3a6e16fabe7e on main (public repository).
    url = "https://github.com/heldermcosta/yunohost-finance/archive/99a5b8849b21627202aa39be3ecc3a6e16fabe7e.tar.gz"
    sha256 = "505bab20b2c039561083f1809735f17a9f22fa0bce9ef283462dc5bb41bca6c5"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = true

    [resources.ports]
    main.default = 8800

    [resources.database]
    type = "postgresql"

    [resources.apt]
    packages = "poppler-utils, python3-venv, python3-dev"
