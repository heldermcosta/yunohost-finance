packaging_format = 2

id = "finance"
name = "Finance"
description.en = "Self-hosted personal finance: statement import, reconciliation and analytics"
version = "0.3.5~ynh1"
maintainers = ["heldermcosta"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/heldermcosta/yunohost-finance"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"   # login is handled by SSOwat in front of the app (permission auth_header)
disk = "300M"
ram.build = "300M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/finance"

    [install.init_main_permission]
    # Household members: every logged-in YunoHost user. Narrow this if needed.
    type = "group"
    default = "all_users"

[resources]
    [resources.sources.main]
    # Source archive of commit c6df3b407db1fa27df2e113dd8b2911e83f834b6 on main (public repository).
    url = "https://github.com/heldermcosta/yunohost-finance/archive/c6df3b407db1fa27df2e113dd8b2911e83f834b6.tar.gz"
    sha256 = "86e6e306e58ae95fe19271ea5973c8383a4ce1de8f6afcbb927a28cf850d15a8"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = true

    [resources.ports]
    main.default = 8800

    [resources.database]
    type = "postgresql"

    [resources.apt]
    packages = "poppler-utils, python3-venv, python3-dev"
