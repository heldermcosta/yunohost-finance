packaging_format = 2

id = "finance"
name = "Finance"
description.en = "Self-hosted personal finance: statement import, reconciliation and analytics"
version = "0.3.20~ynh1"
maintainers = ["heldermcosta"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/heldermcosta/yunohost-finance"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"   # login is handled by SSOwat in front of the app (permission auth_header)
disk = "300M"
ram.build = "300M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/finance"

    [install.init_main_permission]
    # Household members: every logged-in YunoHost user. Narrow this if needed.
    type = "group"
    default = "all_users"

[resources]
    [resources.sources.main]
    # Source archive of commit df29e844ceae2fe14c139f7a5fdf26b0a0a1e419 on main (public repository).
    url = "https://github.com/heldermcosta/yunohost-finance/archive/df29e844ceae2fe14c139f7a5fdf26b0a0a1e419.tar.gz"
    sha256 = "e834b486ed5495520a2d70b6464ed2be7a0ef0d4a4504f6528800862409bda42"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = true

    [resources.ports]
    main.default = 8800

    [resources.database]
    type = "postgresql"

    [resources.apt]
    packages = "poppler-utils, python3-venv, python3-dev"
